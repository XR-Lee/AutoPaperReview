version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: pre-release
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: pre-release
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
