name: Confidentiality

on:
  # Pushes and pull requests for every branch, including pre-release and main.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confidentiality:
    name: Tracked files stay generic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject paper-specific and review files
        run: python3 scripts/check_confidentiality.py
